name: Update Catalog from Telegram

on:
  schedule:
    # Ejecutar cada 30 minutos (minuto 5 y minuto 35) para evitar colas de GitHub
    - cron: '5,35 * * * *'
  # Permitir ejecución manual desde la web de GitHub
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Permiso para hacer commit y push

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Instalar dependencias necesarias
        pip install requests bencodepy fastapi uvicorn

    - name: Run update script
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        ALLOWED_CHAT_IDS: ${{ secrets.ALLOWED_CHAT_IDS }}
        # Variables opcionales
        PYTHONUNBUFFERED: 1
      run: |
        python app/process_batch.py

    - name: Commit and Push changes
      uses: stefanzweifel/git-auto-commit-action@v4
      with:
        commit_message: "Auto-update catalog and cache [skip ci]"
        file_pattern: "catalog.json cache.db"
