name: Actualizar Choloretro

on:
  schedule:
    - cron: '30 4 * * *' # Ejecutar a las 4:30 AM
  workflow_dispatch:

jobs:
  update_and_build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        cache: 'pip' # Añade caché para acelerar instalaciones futuras

    - name: Install dependencies
      # Es una buena práctica usar un archivo requirements.txt
      run: pip install -r requirements.txt

    - name: Descargar Catalogo Anterior de R2
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        CLOUDFLARE_ENDPOINT: https://${{ secrets.CLOUDFLARE_ENDPOINT }}.r2.cloudflarestorage.com
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      run: |
        # Intentamos descargar el JSON anterior. El "|| true" evita que el workflow falle si es la primera vez y el archivo no existe aún.
        aws s3 cp s3://$R2_BUCKET_NAME/catalog_choloretro.json catalog_choloretro.json --endpoint-url $CLOUDFLARE_ENDPOINT || true

    - name: Generar Catalogo Choloretro
      env:
        TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        ONEFICHIER_API_KEY: ${{ secrets.ONEFICHIER_API_KEY }}
        ONEFICHIER_FOLDER_ID: ${{ secrets.ONEFICHIER_FOLDER_ID }}
        ONEFICHIER_API_KEY_2: ${{ secrets.ONEFICHIER_API_KEY_2 }}
        ONEFICHIER_FOLDER_ID_2: ${{ secrets.ONEFICHIER_FOLDER_ID_2 }}
      run: python app/generate_choloretro.py

    - name: Empaquetar Repositorio (Zips y XML)
      run: python tools/create_repository.py

    - name: Encriptar Base de Datos a .bin
      run: |
        python -c "
        import zlib
        with open('cache_choloretro.db', 'rb') as f:
            raw_data = f.read()
        data = bytearray(zlib.compress(raw_data))
        key = bytearray('CholoRetro_XOR_Key_2024', 'utf-8')
        for i in range(len(data)):
            data[i] ^= key[i % len(key)]
        with open('cache_choloretro.bin', 'wb') as f:
            f.write(data)
        "

    - name: Subir artefactos a Cloudflare R2
      # Este paso utiliza el AWS CLI, que es compatible con la API S3 de Cloudflare R2.
      env:
        # Estas credenciales deben estar configuradas en los Secretos de tu repositorio
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        # El endpoint URL apunta a tu cuenta de Cloudflare R2
        CLOUDFLARE_ENDPOINT: https://${{ secrets.CLOUDFLARE_ENDPOINT }}.r2.cloudflarestorage.com
        # El nombre de tu bucket en R2
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      run: |
        # Subir los archivos generados al bucket de R2
        aws s3 cp cache_choloretro.bin s3://$R2_BUCKET_NAME/ --endpoint-url $CLOUDFLARE_ENDPOINT
        aws s3 cp version_choloretro.txt s3://$R2_BUCKET_NAME/ --endpoint-url $CLOUDFLARE_ENDPOINT
        aws s3 cp catalog_choloretro.json s3://$R2_BUCKET_NAME/ --endpoint-url $CLOUDFLARE_ENDPOINT
        
        echo "Archivos subidos a Cloudflare R2 exitosamente."
