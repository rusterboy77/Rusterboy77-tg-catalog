name: Actualizar Choloretro

on:
  schedule:
    - cron: '30 4 * * *' # Ejecutar a las 4:30 AM
  workflow_dispatch:

jobs:
  update_and_build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        cache: 'pip' 

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Descargar y Desencriptar Catalogo Anterior de R2
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        CLOUDFLARE_ENDPOINT: https://${{ secrets.CLOUDFLARE_ENDPOINT }}.r2.cloudflarestorage.com
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      run: |
        # Intentamos descargar el JSON encriptado. El "|| true" evita que el workflow falle si es la primera vez y el archivo no existe.
        aws s3 cp s3://$R2_BUCKET_NAME/catalog_choloretro.enc catalog_choloretro.enc --endpoint-url $CLOUDFLARE_ENDPOINT || true
        # Si el archivo existe, lo desencriptamos. Si no, creamos un JSON vacío para que el script no falle.
        if [ -f "catalog_choloretro.enc" ]; then
          echo "with open('catalog_choloretro.enc', 'rb') as f: data = bytearray(f.read())" > dec.py
          echo "key = bytearray('${{ secrets.CHOLORETRO_JSON_KEY }}', 'utf-8')" >> dec.py
          echo "for i in range(len(data)): data[i] ^= key[i % len(key)]" >> dec.py
          echo "with open('catalog_choloretro.json', 'wb') as f: f.write(data)" >> dec.py
          python dec.py
        else
          echo '{"results": []}' > catalog_choloretro.json
        fi

    - name: Generar Catalogo Choloretro
      env:
        TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        ONEFICHIER_API_KEY: ${{ secrets.ONEFICHIER_API_KEY }}
        ONEFICHIER_FOLDER_ID: ${{ secrets.ONEFICHIER_FOLDER_ID }}
        ONEFICHIER_API_KEY_2: ${{ secrets.ONEFICHIER_API_KEY_2 }}
        ONEFICHIER_FOLDER_ID_2: ${{ secrets.ONEFICHIER_FOLDER_ID_2 }}
      run: python app/generate_choloretro.py

    - name: Empaquetar Repositorio (Zips y XML)
      run: python tools/create_repository.py

    - name: Encriptar Base de Datos a .bin
      run: |
        echo "import zlib" > enc_db.py
        echo "with open('cache_choloretro.db', 'rb') as f: raw_data = f.read()" >> enc_db.py
        echo "data = bytearray(zlib.compress(raw_data))" >> enc_db.py
        echo "key = bytearray('${{ secrets.CHOLORETRO_XOR_KEY }}', 'utf-8')" >> enc_db.py
        echo "for i in range(len(data)): data[i] ^= key[i % len(key)]" >> enc_db.py
        echo "with open('cache_choloretro.bin', 'wb') as f: f.write(data)" >> enc_db.py
        python enc_db.py

    - name: Encriptar Catalogo JSON
      run: |
        echo "with open('catalog_choloretro.json', 'rb') as f: data = bytearray(f.read())" > enc_json.py
        echo "key = bytearray('${{ secrets.CHOLORETRO_JSON_KEY }}', 'utf-8')" >> enc_json.py
        echo "for i in range(len(data)): data[i] ^= key[i % len(key)]" >> enc_json.py
        echo "with open('catalog_choloretro.enc', 'wb') as f: f.write(data)" >> enc_json.py
        python enc_json.py

    - name: Subir artefactos a Cloudflare R2
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        CLOUDFLARE_ENDPOINT: https://${{ secrets.CLOUDFLARE_ENDPOINT }}.r2.cloudflarestorage.com
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      run: |
        aws s3 cp cache_choloretro.bin s3://$R2_BUCKET_NAME/ --endpoint-url $CLOUDFLARE_ENDPOINT
        aws s3 cp version_choloretro.txt s3://$R2_BUCKET_NAME/ --endpoint-url $CLOUDFLARE_ENDPOINT
        aws s3 cp catalog_choloretro.enc s3://$R2_BUCKET_NAME/ --endpoint-url $CLOUDFLARE_ENDPOINT
        
        echo "Archivos subidos a Cloudflare R2 exitosamente."
