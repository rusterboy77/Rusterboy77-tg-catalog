name: Catalog Auto-Update

on:
  # Añadimos trigger 'push' para asegurar que se registra y para debug
  push:
    branches:
      - main
  schedule:
    # Ejecutar cada hora en el minuto 15 (para evitar colas y asegurar arranque)
    - cron: '30 4 * * *' # Ejecutar a las 4:30 AM
  # Permitir ejecución manual desde la web de GitHub
  workflow_dispatch:

# Evitar que se acumulen ejecuciones si una tarda mucho
concurrency:
  group: catalog-sync
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Permiso para hacer commit y push

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Instalar dependencias necesarias
        pip install requests bencodepy fastapi uvicorn

    # NUEVO: Actualizar repo antes de procesar para evitar errores de push (non-fast-forward)
    - name: Pull latest changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git pull origin main --rebase || git pull origin main

    - name: Run update script
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        ALLOWED_CHAT_IDS: ${{ secrets.ALLOWED_CHAT_IDS }}
        # Variables opcionales
        PYTHONUNBUFFERED: 1
      run: |
        python app/process_batch.py

    - name: Commit and Push changes
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Auto-update catalog and cache"
        file_pattern: "catalog.json cache.db"

    # NUEVO: Confirmar a Telegram SOLO si el commit/push anterior tuvo éxito
    - name: Confirm Telegram Updates
      if: success()
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      run: |
        if [ -f telegram_offset.txt ]; then
          OFFSET=$(cat telegram_offset.txt)
          echo "Confirmando offset $OFFSET a Telegram..."
          curl -s "https://api.telegram.org/bot${BOT_TOKEN}/getUpdates?offset=${OFFSET}" > /dev/null
        else
          echo "No hay actualizaciones nuevas para confirmar."
        fi
