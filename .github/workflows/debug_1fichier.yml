name: Obtener IDs 1fichier

on: 
  workflow_dispatch: # Permite ejecutarlo manualmente con un botón

jobs:
  list-folders:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Instalar requests
        run: pip install requests

      - name: Consultar API 1fichier
        env:
          API_KEY: ${{ secrets.ONEFICHIER_API_KEY }}
        run: |
          cat <<EOF > script.py
          import requests, os, json
          key = os.environ.get('API_KEY')
          if not key:
              print('Error: No se detectó ONEFICHIER_API_KEY en los secrets.')
              exit(1)
          
          url = 'https://api.1fichier.com/v1/folder/ls.cgi'
          headers = {'Authorization': f'Bearer {key}', 'Content-Type': 'application/json'}
          
          def list_recursive(folder_id, path=""):
              resp = requests.post(url, json={'folder_id': folder_id}, headers=headers)
              if resp.status_code == 200:
                  data = resp.json()
                  subfolders = data.get('sub_folders', [])
                  for f in subfolders:
                      current_name = f['name']
                      current_id = f['id']
                      print(f"📂 {path}/{current_name}  |  ID: {current_id}")
                      # Llamada recursiva para entrar en esta carpeta
                      list_recursive(current_id, f"{path}/{current_name}")
              else:
                  print(f"Error leyendo carpeta ID {folder_id}: {resp.status_code}")
          
          print('\n' + '='*40)
          print(' ÁRBOL DE CARPETAS (RECURSIVO)')
          print('='*40)
          # Iniciar escaneo desde la raíz (ID 0)
          list_recursive(0)
          print('='*40 + '\n')
          EOF
          python script.py
