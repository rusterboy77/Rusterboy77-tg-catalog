name: Obtener IDs 1fichier

on: 
  workflow_dispatch: # Permite ejecutarlo manualmente con un botón

jobs:
  list-folders:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Instalar requests
        run: pip install requests

      - name: Consultar API 1fichier
        env:
          API_KEY: ${{ secrets.ONEFICHIER_API_KEY }}
          API_KEY_2: ${{ secrets.ONEFICHIER_API_KEY_2 }}
        run: |
          cat <<EOF > script.py
          import requests, os, json
          
          accounts = []
          if os.environ.get('API_KEY'):
              accounts.append({'name': 'Cuenta 1', 'key': os.environ.get('API_KEY')})
          if os.environ.get('API_KEY_2'):
              accounts.append({'name': 'Cuenta 2', 'key': os.environ.get('API_KEY_2')})
          
          if not accounts:
              print('Error: No se detectaron secrets ONEFICHIER_API_KEY o ONEFICHIER_API_KEY_2.')
              exit(1)

          def list_recursive(api_key, folder_id, path=""):
              url = 'https://api.1fichier.com/v1/folder/ls.cgi'
              headers = {'Authorization': f'Bearer {api_key}', 'Content-Type': 'application/json'}
              resp = requests.post(url, json={'folder_id': folder_id}, headers=headers)
              if resp.status_code == 200:
                  data = resp.json()
                  subfolders = data.get('sub_folders', [])
                  for f in subfolders:
                      current_name = f['name']
                      current_id = f['id']
                      print(f"📂 {path}/{current_name}  |  ID: {current_id}")
                      # Llamada recursiva para entrar en esta carpeta
                      list_recursive(api_key, current_id, f"{path}/{current_name}")
              else:
                  print(f"Error leyendo carpeta ID {folder_id}: {resp.status_code}")
          
          for acc in accounts:
              print('\n' + '='*50)
              print(f" ÁRBOL DE CARPETAS (RECURSIVO) - {acc['name']}")
              print('='*50)
              try:
                  # Iniciar escaneo desde la raíz (ID 0)
                  list_recursive(acc['key'], 0)
              except Exception as e:
                  print(f"Error procesando {acc['name']}: {e}")
              print('='*50 + '\n')
          EOF
          python script.py
